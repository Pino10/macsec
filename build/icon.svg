<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2a2a"/><stop offset="0.55" stop-color="#061417"/><stop offset="1" stop-color="#040a10"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.55"/><stop offset="0.6" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.95" r="0.7">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.4"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#glow)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#glow2)"/>
  <rect x="65" y="65" width="894" height="894" rx="199" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  <!-- glass shield -->
  <path d="M512 200 L762 290 C762 520 680 700 512 800 C344 700 262 520 262 290 Z" fill="url(#shield)" stroke="url(#edge)" stroke-width="6"/>
  <!-- inner shield -->
  <path d="M512 262 L706 333 C706 512 642 650 512 730 C382 650 318 512 318 333 Z" fill="url(#inner)" opacity="0.92"/>
  <path d="M512 262 L706 333 C706 400 698 460 682 512 L342 512 C326 460 318 400 318 333 Z" fill="#ffffff" opacity="0.14"/>
  <!-- magnifier / scan mark -->
  <circle cx="494" cy="478" r="92" fill="none" stroke="#04211c" stroke-width="34"/>
  <line x1="560" y1="546" x2="628" y2="614" stroke="#04211c" stroke-width="38" stroke-linecap="round"/>
  <path d="M452 478 l30 30 l56 -60" fill="none" stroke="#04211c" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
