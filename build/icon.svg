<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141634"/><stop offset="0.5" stop-color="#090a1c"/><stop offset="1" stop-color="#05060d"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.22" cy="0.16" r="0.8">
      <stop offset="0" stop-color="#38e1ff" stop-opacity="0.38"/><stop offset="0.65" stop-color="#38e1ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.9" cy="0.92" r="0.75">
      <stop offset="0" stop-color="#8b6cff" stop-opacity="0.5"/><stop offset="1" stop-color="#8b6cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ion" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38e1ff"/><stop offset="1" stop-color="#8b6cff"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.8"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38e1ff" stop-opacity="0"/><stop offset="1" stop-color="#38e1ff" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="core" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.35" stop-color="#9ff0ff"/><stop offset="1" stop-color="#38e1ff"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <clipPath id="hexclip"><path d="M512 214 L770 363 L770 661 L512 810 L254 661 L254 363 Z"/></clipPath>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#glowA)"/>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#glowB)"/>
  <rect x="65" y="65" width="894" height="894" rx="207" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>

  <!-- glass hexagon: the shield -->
  <path d="M512 214 L770 363 L770 661 L512 810 L254 661 L254 363 Z" fill="url(#glass)" stroke="url(#edge)" stroke-width="7" stroke-linejoin="round"/>

  <!-- radar: rings and a sweep, inside the shield -->
  <g clip-path="url(#hexclip)">
    <circle cx="512" cy="512" r="210" fill="none" stroke="#38e1ff" stroke-opacity="0.22" stroke-width="4"/>
    <circle cx="512" cy="512" r="150" fill="none" stroke="#38e1ff" stroke-opacity="0.32" stroke-width="4"/>
    <path d="M512 512 L742 512 A230 230 0 0 0 675 349 Z" fill="url(#sweep)"/>
  </g>

  <!-- the iris: an engine that sees -->
  <circle cx="512" cy="512" r="104" fill="none" stroke="url(#ion)" stroke-width="26"/>
  <circle cx="512" cy="512" r="58" fill="#38e1ff" opacity="0.55" filter="url(#blur)"/>
  <circle cx="512" cy="512" r="44" fill="url(#core)"/>

  <!-- one finding, caught -->
  <circle cx="660" cy="396" r="40" fill="#ff3d7f" opacity="0.5" filter="url(#blur)"/>
  <circle cx="660" cy="396" r="22" fill="#ff3d7f"/>
  <circle cx="660" cy="396" r="22" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="4"/>
</svg>
