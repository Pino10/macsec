name: Build and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Create this release tag (for example v0.5.1). Leave empty to only build.'
        required: false
        default: ''
      also_here:
        description: 'Also publish in this repository, for copies of MacSec that still look here for updates.'
        type: boolean
        default: false

# Builds run on GitHub's Macs. Set the repository variable MAC_RUNNER to "self-hosted" to use your own.

jobs:
  build-mac:
    runs-on: ${{ vars.MAC_RUNNER == 'self-hosted' && fromJSON('["self-hosted","macOS","ARM64"]') || 'macos-latest' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # No Apple Developer account: the app is ad-hoc signed (see scripts/adhoc-sign.cjs).
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: The command line works
        run: |
          APP="dist/mac-arm64/MacSec.app/Contents/MacOS/MacSec"
          "$APP" --headless help | head -3
          "$APP" --headless bench
          echo "The headless command line answered."

      - name: Check the signature and that the app starts
        run: |
          APP="dist/mac-arm64/MacSec.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # Launch the real app and make sure it is still running after 20 seconds.
          "$APP/Contents/MacOS/MacSec" > app.log 2>&1 &
          PID=$!
          sleep 20
          if ! kill -0 $PID 2>/dev/null; then
            echo "MacSec exited during startup:"; cat app.log; exit 1
          fi
          kill $PID || true
          echo "MacSec started and stayed running."
          cat app.log

      # The in-app updater only installs a DMG whose hash matches this list.
      - name: Checksums
        run: cd dist && shasum -a 256 *.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt

      # The list is signed with a key that only this workflow holds, so the app can tell a real
      # release from an edited one. No secret, no release.
      - name: Sign the checksums
        env:
          MACSEC_SIGNING_KEY: ${{ secrets.MACSEC_SIGNING_KEY }}
        run: |
          if [ -z "$MACSEC_SIGNING_KEY" ]; then
            echo "::error::MACSEC_SIGNING_KEY is not set. A release must be signed by MacSec's key."
            exit 1
          fi
          node -e "const {readFileSync,writeFileSync}=require('fs');const {sign,createPrivateKey}=require('crypto');const key=createPrivateKey(process.env.MACSEC_SIGNING_KEY);writeFileSync('dist/SHA256SUMS.txt.sig', sign(null, readFileSync('dist/SHA256SUMS.txt'), key))"
          node -e "const {readFileSync}=require('fs');const {verify,createPublicKey}=require('crypto');const ok=verify(null, readFileSync('dist/SHA256SUMS.txt'), createPublicKey(readFileSync('build/release-signing.pub','utf8')), readFileSync('dist/SHA256SUMS.txt.sig'));if(!ok){console.error('The signature does not check out');process.exit(1)}"
          ls -l dist/SHA256SUMS.txt.sig

      - uses: actions/upload-artifact@v4
        with:
          name: macsec-dmg
          path: |
            dist/*.dmg
            dist/SHA256SUMS.txt
            dist/SHA256SUMS.txt.sig

      # A release created in the GitHub UI (tag push): just attach the files.
      - name: Attach DMGs to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/SHA256SUMS.txt
            dist/SHA256SUMS.txt.sig

      # A tag pushed from the command line already made a release, but its body is empty.
      - name: Set the release notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
        run: |
          awk '/^## /{n++} n==1' RELEASE_NOTES.md > notes.md
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          echo "Notes set on $GITHUB_REF_NAME"

      # Started from the Actions tab with a tag: publish the release.
      - name: Publish the release
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
          REPO: ${{ vars.RELEASES_REPO || github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          # Only this release's notes: the top section of RELEASE_NOTES.md.
          awk '/^## /{n++} n==1' RELEASE_NOTES.md > notes.md
          target=""
          [ "$REPO" = "$GITHUB_REPOSITORY" ] && target="--target $GITHUB_SHA"
          gh release create "$TAG" dist/*.dmg dist/SHA256SUMS.txt dist/SHA256SUMS.txt.sig --repo "$REPO" $target \
            --title "MacSec $TAG" --notes-file notes.md --latest
          echo "Published $TAG to $REPO"

      - name: Also publish in this repository
        if: github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.also_here && vars.RELEASES_REPO != '' && vars.RELEASES_REPO != github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          awk '/^## /{n++} n==1' RELEASE_NOTES.md > notes.md
          gh release create "$TAG" dist/*.dmg dist/SHA256SUMS.txt dist/SHA256SUMS.txt.sig --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "MacSec $TAG" --notes-file notes.md --latest
